name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build with a canary key and make sure it is not in the bundle
        run: |
          GEMINI_API_KEY=CANARY_DO_NOT_SHIP npm run build
          if grep -rq CANARY_DO_NOT_SHIP dist; then echo "API key leaked into dist"; exit 1; fi
